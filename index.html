<style>

<script>
(function () {
const $ = (s, e = document) => e.querySelector(s);

const queue = [];
let actx = null;

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ---------- Imagenes ---------- */
function encodeBmp(id) {
  const w = id.width, h = id.height, rs = (w * 3 + 3) & ~3, sz = rs * h;
  const buf = new ArrayBuffer(54 + sz), v = new DataView(buf), u = new Uint8Array(buf);
  v.setUint8(0, 66); v.setUint8(1, 77); v.setUint32(2, 54 + sz, true); v.setUint32(10, 54, true);
  v.setUint32(14, 40, true); v.setInt32(18, w, true); v.setInt32(22, h, true);
  v.setUint16(26, 1, true); v.setUint16(28, 24, true); v.setUint32(34, sz, true);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const s = ((h - 1 - y) * w + x) * 4, d = 54 + y * rs + x * 3;
    u[d] = id.data[s + 2]; u[d + 1] = id.data[s + 1]; u[d + 2] = id.data[s];

}
async function runImage(f) {
  const to = $('#img-fmt').value, q = +$('#img-q').value;

  c.width = bm.width; c.height = bm.height;
  const x = c.getContext('2d');
  if (to !== 'png' && to !== 'webp') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
  x.drawImage(bm, 0, 0); bm.close();

  if (to === 'bmp') blob = encodeBmp(x.getImageData(0, 0, c.width, c.height));
  else if (to === 'pdf') {
    const w = c.width, h = c.height;
    const d = new jspdf.jsPDF({ orientation: w > h ? 'l' : 'p', unit: 'px', format: [w, h], compress: true });
    d.addImage(c.toDataURL('image/jpeg', q), 'JPEG', 0, 0, w, h);

    blob = await new Promise(r => c.toBlob(r, 'image/' + to, q));
    if (!blob || blob.type !== 'image/' + to) throw new Error('El navegador no admite exportar a ' + to.toUpperCase());

}

/* ---------- Audio ---------- */
function encodeWav(b) {

  const v = new DataView(new ArrayBuffer(44 + ds));

  v.setUint16(20, 1, true); v.setUint16(22, nc, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * nc * 2, true); v.setUint16(32, nc * 2, true); v.setUint16(34, 16, true);
  s(36, 'data'); v.setUint32(40, ds, true);

  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < nc; c++) {
    const x = Math.max(-1, Math.min(1, d[c][i]));
    v.setInt16(o, x < 0 ? x * 32768 : x * 32767, true); o += 2;
  }

}
function toI16(a) {
  const r = new Int16Array(a.length);
  for (let i = 0; i < a.length; i++) { const x = Math.max(-1, Math.min(1, a[i])); r[i] = x < 0 ? x * 32768 : x * 32767; }
  return r;

function encodeMp3(b, kbps) {

  const nc = b.numberOfChannels, enc = new lamejs.Mp3Encoder(nc, b.sampleRate, kbps);
  const L = toI16(b.getChannelData(0)), R = nc > 1 ? toI16(b.getChannelData(1)) : null, parts = [];

async function runAudio(f, p = 'aud') {
  const g = id => $('#' + p + '-' + id).value, to = g('fmt'), srSel = +g('sr'), chSel = +g('ch'), kbps = +g('kbps');

  const blob = to === 'mp3' ? encodeMp3(out, kbps) : encodeWav(out);

async function runVideo(f) {
  try { return await runAudio(f, 'vid'); }
  catch (e) { throw new Error(/decod|encod/i.test((e && e.name || '') + (e && e.message || '')) ? 'No se pudo leer el audio de este video; formato o códec no compatible con el navegador' : e.message); }
}

/* ---------- Documentos y datos ---------- */
function mdText(t) {
  return t.replace(/```\w*\n?/g, '').replace(/^#{1,6}\s+/gm, '').replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/\*(.+?)\*/g, '$1').replace(/`([^`]+)`/g, '$1').replace(/!?\[([^\]]*)\]\(([^)]*)\)/g, '$1 ($2)')
    .replace(/^>\s?/gm, '').replace(/^\s*[-*+]\s+/gm, '- ');
}
function mdHtml(t) {
  const inl = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  const li = /^\s*([-*+]|\d+\.)\s+/, L = t.replace(/\r/g, '').split('\n');
  let o = '', i = 0, m;
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) {
      const c = []; i++;
      while (i < L.length && !/^```/.test(L[i])) c.push(L[i++]);
      i++; o += '<pre><code>' + esc(c.join('\n')) + '</code></pre>';
    } else if ((m = l.match(/^(#{1,6})\s+(.*)/))) {
      o += '<h' + m[1].length + '>' + inl(m[2]) + '</h' + m[1].length + '>'; i++;
    } else if (/^(-{3,}|\*{3,})\s*$/.test(l)) { o += '<hr>'; i++; }
    else if (/^>/.test(l)) {
      const c = []; while (i < L.length && /^>/.test(L[i])) c.push(L[i++].replace(/^>\s?/, ''));
      o += '<blockquote>' + inl(c.join(' ')) + '</blockquote>';
    } else if (li.test(l)) {
      const ol = /^\s*\d+\./.test(l); let c = '';
      while (i < L.length && li.test(L[i])) c += '<li>' + inl(L[i++].replace(li, '')) + '</li>';
      o += ol ? '<ol>' + c + '</ol>' : '<ul>' + c + '</ul>';
    } else if (!l.trim()) i++;
    else {
      const c = [L[i++]];
      while (i < L.length && L[i].trim() && !/^(#{1,6}\s|```|>)/.test(L[i]) && !li.test(L[i])) c.push(L[i++]);
      o += '<p>' + inl(c.join(' ')) + '</p>';
    }
  }
  return o;
}
function wrapHtml(title, body) {
  return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>' + esc(title) +
    '</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.6;color:#1d1d1f}' +
    'pre{background:#f5f5f7;padding:12px;border-radius:8px;overflow:auto;white-space:pre-wrap}code{font-family:ui-monospace,monospace}' +
    'blockquote{border-left:3px solid #d2d2d7;margin-left:0;padding-left:14px;color:#6e6e73}</style></head><body>' + body + '</body></html>';
}
function textPdf(text, isMd) {
  const d = new jspdf.jsPDF({ unit: 'pt', format: 'a4' });
  const W = d.internal.pageSize.getWidth(), H = d.internal.pageSize.getHeight(), mg = 56;
  let y = mg;
  text.replace(/\r/g, '').split('\n').forEach(raw => {
    if (/^```/.test(raw)) return;
    let size = 11, bold = false, line = raw, h;
    if (isMd && (h = raw.match(/^(#{1,6})\s+(.*)/))) { size = 22 - h[1].length * 2; bold = true; line = h[2]; }
    else if (isMd) line = mdText(raw);
    d.setFont('helvetica', bold ? 'bold' : 'normal'); d.setFontSize(size);
    if (!line.trim()) { y += 8; return; }
    d.splitTextToSize(line, W - 2 * mg).forEach(ln => {
      if (y > H - mg) { d.addPage(); y = mg; }
      d.text(ln, mg, y); y += size * 1.4;
    });
    if (bold) y += 4;
  });
  return d.output('blob');
}
async function readDocx(f) {
  const z = await JSZip.loadAsync(await f.arrayBuffer()), x = z.file('word/document.xml');
  if (!x) throw new Error('El archivo .docx no es válido');
  const d = new DOMParser().parseFromString(await x.async('string'), 'application/xml');
  return [...d.getElementsByTagName('w:p')].map(p => [...p.getElementsByTagName('w:t')].map(t => t.textContent).join('')).join('\n');

function rtfText(r) {
  return r.replace(/\{\\(?:\*|fonttbl|colortbl|stylesheet|info)(?:[^{}]|\{[^{}]*\})*\}/g, '').replace(/\\par[d]?/g, '\n')
    .replace(/\\'([0-9a-f]{2})/gi, (m, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/\\u(-?\d+)\??/g, (m, n) => String.fromCharCode(n < 0 ? +n + 65536 : +n))
    .replace(/\\[a-z]+-?\d* ?/gi, '').replace(/[{}]/g, '').trim();

function buildDocx(text, isMd) {
  const z = new JSZip(), hd = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const paras = text.replace(/\r/g, '').split('\n').map(l => {
    let pr = '', h;
    if (isMd && (h = l.match(/^(#{1,6})\s+(.*)/))) { pr = '<w:rPr><w:b/><w:sz w:val="' + (44 - h[1].length * 4) + '"/></w:rPr>'; l = h[2]; }

  const el = document.createElement('section');

  el.innerHTML = '<div class="card"><label class="f">Enlaces o textos, uno por línea<textarea id="qr-txt" rows="4" placeholder="https://ejemplo.com"></textarea></label></div>' +
    '<div class="card"><div class="grid">' +
    opt('qr-fmt', 'Formato de salida', [['png', 'PNG'], ['svg', 'SVG vectorial']]) +
    opt('qr-size', 'Tamaño', [['256', '256 px'], ['512', '512 px'], ['1024', '1024 px'], ['2048', '2048 px']]) +
    opt('qr-ec', 'Corrección de errores', [['M', 'Media'], ['L', 'Baja'], ['Q', 'Alta'], ['H', 'Máxima']]) +
    opt('qr-mg', 'Margen', [['4', '4 módulos'], ['2', '2 módulos'], ['1', '1 módulo'], ['0', 'Sin margen']]) +
    '<label class="f">Color del código<input type="color" id="qr-fg" value="#000000"></label>' +
    '<label class="f">Color de fondo<input type="color" id="qr-bg" value="#ffffff"></label></div></div>' +
    '<div class="card"><div class="row"><h3>Vista previa</h3><span class="m" id="qr-n"></span></div><div class="qrprev"><canvas id="qr-cv"></canvas></div>' +
    '<p class="m" id="qr-msg" style="text-align:center"></p><div class="row end"><button class="btn" id="go-qr">Generar y añadir a la cola</button></div><p class="m" id="s-qr"></p></div>';
  $('#panels').appendChild(el);
  el.addEventListener('input', qrPreview); el.addEventListener('change', qrPreview);
  $('#go-qr').onclick = async () => {
    const L = qrLines(), s = $('#s-qr'), o = qrOpts(), fmtSel = $('#qr-fmt').value, errs = [];
    s.className = 'm';
    if (!L.length) { s.className = 'm err'; s.textContent = 'Escriba al menos un enlace.'; return; }
    let ok = 0;
    for (const raw of L) {
      const t = qrNorm(raw), slug = t.replace(/^[a-z]+:\/*/i, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').slice(0, 40) || 'codigo';
      try {
        const blob = fmtSel === 'svg' ? new Blob([qrSvg(t, o)], { type: 'image/svg+xml' }) : await new Promise(r => qrCanvas(t, o).toBlob(r, 'image/png'));
        queue.push({ blob, name: 'qr-' + slug + '.' + fmtSel }); ok++;
      } catch (e) { errs.push(raw.slice(0, 30) + ' (' + (e.message || 'error') + ')'); }
    }
    s.className = 'm' + (errs.length ? ' err' : '');
    s.textContent = ok + ' códigos añadidos a la cola de descarga.' + (errs.length ? ' Errores: ' + errs.join('; ') : '');
    renderQueue();
  };
  qrPreview();
}

/* ---------- Utilidades y cola ---------- */
function buildQueue() {
  const el = document.createElement('section');
  el.id = 'p-q'; el.className = 'panel'; el.setAttribute('role', 'tabpanel');
  el.innerHTML = '<div class="card"><div class="row"><div><h3>Cola de descarga</h3><p class="m" id="q-sum"></p></div>' +
    '<div class="act"><button class="btn sec" id="q-clr">Vaciar cola</button><button class="btn" id="q-zip">Descargar todo (ZIP)</button></div></div>' +
    '<ul class="list" id="q-list"></ul><p class="m" id="q-st"></p></div>';
  $('#panels').appendChild(el);
  $('#q-list').onclick = e => {
    const d = e.target.closest('[data-dl]'), r = e.target.closest('[data-del]');
    if (d) { const it = queue[+d.dataset.dl]; download(it.blob, it.name); }
    if (r) { queue.splice(+r.dataset.del, 1); renderQueue(); }
  };
  $('#q-clr').onclick = () => { queue.length = 0; renderQueue(); };
  $('#q-zip').onclick = async () => {
    const st = $('#q-st'), zip = new JSZip(), used = {};
    st.textContent = 'Generando archivo ZIP...';
    queue.forEach(it => {
      let n = it.name;
      if (used[n]) { const x = extOf(n); n = baseName(n) + ' (' + used[n] + ').' + x; }
      used[it.name] = (used[it.name] || 0) + 1; zip.file(n, it.blob);
    });
    try { download(await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' }), 'conversiones.zip'); st.textContent = ''; }
    catch (err) { st.textContent = 'No se pudo generar el ZIP: ' + err.message; }
  };
  renderQueue();
}
function renderQueue() {
  const tot = queue.reduce((a, b) => a + b.blob.size, 0);
  $('#q-sum').textContent = queue.length ? queue.length + ' archivos, ' + fmt(tot) + ' en total' : 'Sin archivos convertidos';
  $('#q-list').innerHTML = queue.length ? queue.map((it, i) => '<li><span class="nm">' + esc(it.name) + '</span><span class="act"><span class="m">' + fmt(it.blob.size) +
    '</span><button class="btn sec sm" data-dl="' + i + '">Descargar</button><button class="btn sec sm" data-del="' + i + '">Quitar</button></span></li>') .join('') :
    '<li class="empty">Los archivos convertidos aparecerán aquí.</li>';
  $('#q-zip').disabled = $('#q-clr').disabled = !queue.length;
  const b = $('#badge'); if (b) { b.textContent = queue.length; b.style.display = queue.length ? '' : 'none'; }
}

/* ---------- Navegacion ---------- */
const TABS = [['img', 'Imágenes'], ['aud', 'Audio'], ['vid', 'Video a audio'], ['doc', 'Documentos y datos'], ['scan', 'Apuntes a PDF'], ['merge', 'Unir PDF'], ['qr', 'Códigos QR'], ['q', 'Utilidades']];
let cur = 'img', theme = 'auto';
function slide(seg, b) {
  const th = $('.thumb', seg);
  th.style.width = b.offsetWidth + 'px'; th.style.transform = 'translateX(' + b.offsetLeft + 'px)';
  requestAnimationFrame(() => th.classList.add('ready'));
}
function show(id) {
  cur = id;
  TABS.forEach(t => {
    $('#p-' + t[0]).classList.toggle('on', t[0] === id);
    $('[data-tab="' + t[0] + '"]').setAttribute('aria-selected', t[0] === id);
  });
  const tb = $('[data-tab="' + id + '"]');
  slide($('#tabs'), tb);
  tb.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
}
function setTheme(v, save) {
  theme = v;
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
  document.querySelectorAll('[data-th]').forEach(b => b.setAttribute('aria-selected', b.dataset.th === v));
  slide($('#theme'), $('[data-th="' + v + '"]'));
  if (save) { try { localStorage.setItem('cp-theme', v); } catch (e) { } }
}
$('#tabs').innerHTML = '<span class="thumb"></span>' + TABS.map(t => '<button role="tab" data-tab="' + t[0] + '">' + t[1] + (t[0] === 'q' ? '<i id="badge" style="display:none">0</i>' : '') + '</button>').join('');
$('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) show(b.dataset.tab); };
['img', 'aud', 'vid', 'doc', 'scan', 'merge'].forEach(build);
buildQueue();
buildQr();
show('img');
$('#theme').onclick = e => { const b = e.target.closest('[data-th]'); if (b) setTheme(b.dataset.th, true); };
let saved = 'auto';
try { saved = localStorage.getItem('cp-theme') || 'auto'; } catch (e) { }
setTheme(saved);
['resize', 'load'].forEach(ev => window.addEventListener(ev, () => { show(cur); setTheme(theme); }));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.out) $('#' + t.dataset.out).textContent = (+t.value).toFixed(+t.dataset.dec); });
})();
</script>
